[package]
name = "steamlogger"
version = "0.1.0"
edition = "2021"
description = "Logs every Steam game session with friends, lobby and map details to JSON"
license = "MIT"

[lib]
name = "steamlogger"
path = "src/lib.rs"

[[bin]]
name = "steamlogger"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
